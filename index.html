<!doctype html>
<html lang="pt-BR">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Acesso ao formulário | Epson</title>

<style>
:root{
    --epson:#10218b;
    --sky:#29a3e8;
    --bg:#f4f7fc;
    --card:#ffffffee;
    --text:#0e1a4a;
    --muted:#56617f;
    --border:#d5ddee;
    --accent:#10218b;
    --accent-hover:#0a166a;
    --on-accent:#fff;
    --ok:#087443;
    --bad:#b42318;
    --panel:#eef3fb;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:"Segoe UI",Arial,sans-serif;
    background:
        linear-gradient(rgba(255,255,255,.85),
        rgba(255,255,255,.85)),
        url("Epson_One_zoom2.png");
    background-size:cover;
    background-position:center;
    color:var(--text);
}

main{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:520px;
    background:var(--card);
    border:1px solid var(--border);
    border-top:6px solid var(--epson);
    border-radius:10px;
    padding:32px;
    box-shadow:0 12px 40px rgba(0,0,0,.15);
}

.logo{
    max-width:180px;
    width:100%;
    height:auto;
    margin-bottom:25px;
}

h1{
    font-size:clamp(2rem,5vw,3rem);
    margin-bottom:15px;
    color:var(--epson);
}

.lead{
    color:var(--muted);
    line-height:1.6;
    margin-bottom:25px;
    font-size:1.1rem;
}

.btn{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    padding:16px;
    border:none;
    border-radius:6px;
    background:var(--accent);
    color:white;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.btn:hover{
    background:var(--accent-hover);
}

.status{
    display:none;
    margin-top:20px;
    padding:20px;
    border-radius:6px;
    background:var(--panel);
}

.status.show{
    display:block;
}

.status.ok{
    border-left:5px solid var(--ok);
}

.status.bad{
    border-left:5px solid var(--bad);
}

.title{
    font-size:1.6rem;
    font-weight:700;
    margin-bottom:10px;
}

.status.ok .title{
    color:var(--ok);
}

.status.bad .title{
    color:var(--bad);
}

.distance{
    font-size:3rem;
    font-weight:700;
    margin-bottom:10px;
    color:var(--epson);
}

.status p{
    color:var(--muted);
    line-height:1.5;
}

.footer{
    margin-top:25px;
    padding-top:20px;
    border-top:1px solid var(--border);
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
}

@media(max-width:600px){

    .card{
        padding:24px;
    }

    h1{
        font-size:2.2rem;
    }

    .distance{
        font-size:2.2rem;
    }
}
</style>

</head>

<body>

<main>

<section class="card">

<img
class="logo"
src="EPSON_LOGO_2023_RGB.png"
alt="Epson">

<h1>Acesso O formulário só pode ser acessado quando o aparelho estiver
a até <strong>1 km</strong> do local autorizado.
</p>

<button id="check" class="btn">
Verificar minha localização
</button>

<div id="status" class="status"></div>

<div class="footer">
Local autorizado: Av. Tucunaré, 720 – Tamboré, Barueri/SP.<br>
O navegador solicitará permissão para usar sua localização.
</div>

</section>

</main>

<script>

const TARGET = {
    lat: -23.4947049,
    lon: -46.8358179
};

const RADIUS = 1000;

const FORM_URL =
"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=RaU9Qh6__km0Hi5-MbQLE8soOvqjAoVBnO9JLW0LHghUMVZTTFlFUjBWRktHMlAyOVcxRE1NTFNCQi4u";

const btn = document.getElementById("check");
const statusBox = document.getElementById("status");

function distanceMeters(lat1, lon1, lat2, lon2){

    const R = 6371000;

    const toRad = n => n * Math.PI / 180;

    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) *
        Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function showStatus(html, type){
    statusBox.className = "status show " + type;
    statusBox.innerHTML = html;
}

function retry(){
    btn.disabled = false;
    btn.textContent = "Tentar novamente";
}

btn.addEventListener("click", () => {

    if(!navigator.geolocation){

        showStatus(
        `<div class="title">Geolocalização não suportada.</div>
        <p>Utilize um navegador mais recente.</p>`,
        "bad");

        return;
    }

    btn.disabled = true;
    btn.textContent = "Obtendo localização...";

    navigator.geolocation.getCurrentPosition(

        position => {

            const distance = distanceMeters(
                position.coords.latitude,
                position.coords.longitude,
                TARGET.lat,
                TARGET.lon
            );

            if(distance <= RADIUS){

                showStatus(
                `
                <div class="title">✅ Localização confirmada</div>

                <div class="distance">
                    ${Math.round(distance)} m
                </div>

                <p>
                    Você está dentro da área permitida.
                </p>

                <br>

                <a class="btn"
                   href="${FORM_URL}"
                   target="_blank">
                    Acessar formulário
                </a>
                `,
                "ok"
                );

                btn.style.display = "none";

            }else{

                showStatus(
                `
                <div class="title">❌ Fora da área permitida</div>

                <div class="distance">
                    ${Math.round(distance)} m
                </div>

                <p>
                    É necessário estar a até
                    1.000 metros do local autorizado
                    para acessar o formulário.
                </p>
                `,
                "bad"
                );

                retry();
            }
        },

        error => {

            let message =
            "Não foi possível obter sua localização.";

            if(error.code === 1){
                message =
                "Permissão de localização negada.";
            }

            if(error.code === 2){
                message =
                "Localização indisponível.";
            }

            if(error.code === 3){
                message =
                "Tempo de solicitação excedido.";
            }

            showStatus(
            `<div class="title">${message}</div>`,
            "bad"
            );

            retry();
        },

        {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
        }
    );
});
</script>

</body>
</html>

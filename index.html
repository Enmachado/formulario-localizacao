<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acesso ao formulário</title>

<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f5f7fb,#101318);
  --card: light-dark(#fff,#171b22);
  --text: light-dark(#172033,#f1f4f8);
  --muted: light-dark(#657087,#a9b1bf);
  --border: light-dark(#dfe4ec,#303744);
  --accent: light-dark(#2563eb,#60a5fa);
  --ok: light-dark(#087443,#4ade80);
  --bad: light-dark(#b42318,#ff8a80);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color: var(--text);
}

main {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}

.card {
  width: min(100%,520px);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 32px;
  box-shadow: 0 12px 40px #0002;
}

h1 {
  margin: 0 0 10px;
  font-size: 28px;
}

p {
  line-height: 1.55;
  color: var(--muted);
}

.badge {
  display: inline-block;
  padding: 7px 10px;
  border-radius: 999px;
  background: #2563eb18;
  color: var(--accent);
  font-weight: 700;
  font-size: 13px;
  margin-bottom: 16px;
}

.btn {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 15px 18px;
  background: var(--accent);
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.btn:disabled {
  opacity: .55;
  cursor: wait;
}

.status {
  margin-top: 18px;
  padding: 14px;
  border-radius: 14px;
  background: light-dark(#f3f6fb,#202631);
  border: 1px solid var(--border);
  display: none;
}

.status.show {
  display: block;
}

.ok {
  color: var(--ok);
}

.bad {
  color: var(--bad);
}

.distance {
  font-size: 26px;
  font-weight: 800;
  margin-top: 6px;
}

.footer {
  margin-top: 22px;
  font-size: 12px;
  color: var(--muted);
}
</style>
</head>

<body>

<main>
<section class="card">

<div class="badge">VERIFICAÇÃO DE LOCALIZAÇÃO</div>

<h1>Acesso ao formulário</h1>

<p>
O formulário só pode ser acessado quando o aparelho estiver dentro de
<strong>1 km</strong> do local autorizado.
</p>

<button id="check" class="btn">
Verificar minha localização
</button>

<div id="status" class="status"></div>

<div class="footer">
Local autorizado: Av. Tucunaré, 720 – Tamboré, Barueri/SP.<br>
O navegador solicitará permissão para usar sua localização.
</div>

</section>
</main>

<script>

const TARGET = {
  lat: -23.4947049,
  lon: -46.8358179
};

const RADIUS = 1000;

const FORM_URL =
'https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=RaU9Qh6__km0Hi5-MbQLE8soOvqjAoVBnO9JLW0LHghUMVZTTFlFUjBWRktHMlAyOVcxRE1NTFNCQi4u';

const btn = document.getElementById('check');
const status = document.getElementById('status');

function distanceMeters(lat1, lon1, lat2, lon2) {

  const R = 6371000;

  const toRad = x => x * Math.PI / 180;

  const p1 = toRad(lat1);
  const p2 = toRad(lat2);

  const dp = toRad(lat2 - lat1);
  const dl = toRad(lon2 - lon1);

  const x =
    Math.sin(dp / 2) ** 2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dl / 2) ** 2;

  return 2 * R * Math.asin(Math.sqrt(x));
}

function showStatus(html, cls = '') {

  status.className = 'status show ' + cls;
  status.innerHTML = html;

}

btn.onclick = () => {

  if (!navigator.geolocation) {

    showStatus(
      '<strong class="bad">Seu navegador não oferece geolocalização.</strong><br>' +
      'Abra este link em um navegador atualizado do celular.',
      'bad'
    );

    return;
  }

  btn.disabled = true;
  btn.textContent = 'Obtendo localização…';

  navigator.geolocation.getCurrentPosition(

    position => {

      const userLat = position.coords.latitude;
      const userLon = position.coords.longitude;

      const distance = distanceMeters(
        userLat,
        userLon,
        TARGET.lat,
        TARGET.lon
      );

      if (distance <= RADIUS) {

        showStatus(

          '<strong class="ok">✓ Localização confirmada</strong>' +

          '<div class="distance">' +
          Math.round(distance) +
          ' m' +
          '</div>' +

          '<p>Você está dentro da área permitida.</p>' +

          '<button class="btn" onclick="location.href=FORM_URL">' +
          'Acessar formulário' +
          '</button>'

        );

      } else {

        showStatus(

          '<strong class="bad">✕ Fora da área permitida</strong>' +

          '<div class="distance">' +
          Math.round(distance) +
          ' m' +
          '</div>' +

          '<p>' +
          'É necessário estar a até 1.000 metros do local autorizado ' +
          'para acessar o formulário.' +
          '</p>',

          'bad'
        );

        btn.disabled = false;
        btn.textContent = 'Tentar novamente';

      }

    },

    error => {

      let message =
        'Não foi possível obter sua localização.';

      if (error.code === 1) {

        message =
          'Você negou a permissão de localização. ' +
          'Ative a localização para continuar.';

      }

      if (error.code === 2) {

        message =
          'O aparelho não conseguiu determinar sua localização. ' +
          'Tente novamente em um local com melhor sinal.';

      }

      showStatus(
        '<strong class="bad">' +
        message +
        '</strong>',
        'bad'
      );

      btn.disabled = false;
      btn.textContent = 'Tentar novamente';

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

};

</script>

</body>
</html>

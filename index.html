<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acesso ao formulário | Epson</title>
<style>
:root {
  --epson: #10218b;
  --sky: #29a3e8;
  --bg-img: url(Epson_One_zoom2.png);
  --bg: #f4f7fc;
  --card: #ffffffee;
  --text: #0e1a4a;
  --muted: #56617f;
  --border: #d5ddee;
  --accent: #10218b;
  --accent-hover: #0a166a;
  --on-accent: #fff;
  --ok: #087443;
  --bad: #b42318;
  --panel: #eef3fb;
  --logo-light: block;
  --logo-dark: none;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-img: url(Epson_One_zoom4.png);
    --bg: #000a4d;
    --card: #0a1257ee;
    --text: #f2f5ff;
    --muted: #b4bfe6;
    --border: #2c3a8f;
    --accent: #29a3e8;
    --accent-hover: #4fb6f0;
    --on-accent: #001040;
    --ok: #5ee0a0;
    --bad: #ff9a90;
    --panel: #0d1a72;
    --logo-light: none;
    --logo-dark: block;
  }
}
:root[data-theme="dark"] {
  --bg-img: url(Epson_One_zoom4.png);
  --bg: #000a4d;
  --card: #0a1257ee;
  --text: #f2f5ff;
  --muted: #b4bfe6;
  --border: #2c3a8f;
  --accent: #29a3e8;
  --accent-hover: #4fb6f0;
  --on-accent: #001040;
  --ok: #5ee0a0;
  --bad: #ff9a90;
  --panel: #0d1a72;
  --logo-light: none;
  --logo-dark: block;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg) var(--bg-img) center / cover no-repeat fixed;
  color: var(--text);
  font-family: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif;
}
main {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 24px clamp(20px, 9vw, 160px);
}
.card {
  width: min(100%, 500px);
  background: var(--card);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-top: 5px solid var(--epson);
  border-radius: 6px;
  padding: 36px 36px 28px;
  box-shadow: 0 24px 60px #00104033;
}
/* os PNGs têm margem transparente; as margens negativas compensam */
.logo { height: 55px; width: auto; margin: -13px 0 17px -18px; }
.logo.light { display: var(--logo-light); }
.logo.dark { display: var(--logo-dark); }
h1 {
  margin: 0 0 12px;
  font-size: clamp(28px, 5vw, 36px);
  line-height: 1.08;
  letter-spacing: -0.02em;
  font-weight: 700;
}
.lead { margin: 0 0 26px; line-height: 1.55; color: var(--muted); font-size: 16px; }
.lead strong { color: var(--text); }
.btn {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 4px;
  padding: 16px 20px;
  background: var(--accent);
  color: var(--on-accent);
  font: inherit;
  font-size: 16px;
  font-weight: 700;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  transition: background .15s;
}
.btn:hover { background: var(--accent-hover); }
.btn:disabled { opacity: .6; cursor: wait; }
.btn:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
.status {
  display: none;
  margin-top: 20px;
  padding: 16px 18px;
  border-radius: 4px;
  background: var(--panel);
  border-left: 5px solid var(--muted);
}
.status.show { display: block; }
.status.ok { border-left-color: var(--ok); }
.status.bad { border-left-color: var(--bad); }
.status .title { font-weight: 700; }
.status.ok .title { color: var(--ok); }
.status.bad .title { color: var(--bad); }
.distance { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0; }
.status p { margin: 0 0 14px; color: var(--muted); line-height: 1.5; }
.status p:last-child { margin-bottom: 0; }
.footer {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  font-size: 13px;
  line-height: 1.5;
  color: var(--muted);
}
@media (max-width: 860px) {
  main { justify-content: center; }
  body { background-position: 70% center; background-attachment: scroll; }
  .card { padding: 28px 22px 22px; }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>
<section class="card">

<img class="logo light" src="EPSON_LOGO_2023_RGB.png" alt="Epson">
<img class="logo dark" src="EPSON_LOGO_2023_WHITE.png" alt="Epson">

<h1>Acesso ao formulário</h1>
<p class="lead">
O formulário só pode ser acessado quando o aparelho estiver a até
<strong>1 km</strong> do local autorizado.
</p>

<button id="check" class="btn">Verificar minha localização</button>

<div id="status" class="status" role="status" aria-live="polite"></div>

<div class="footer">
Local autorizado: Av. Tucunaré, 720 – Tamboré, Barueri/SP.<br>
O navegador solicitará permissão para usar sua localização.
</div>

</section>
</main>

<script>
const TARGET = { lat: -23.4947049, lon: -46.8358179 };
const RADIUS = 1000;
const FORM_URL =
'https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=RaU9Qh6__km0Hi5-MbQLE8soOvqjAoVBnO9JLW0LHghUMVZTTFlFUjBWRktHMlAyOVcxRE1NTFNCQi4u';

const btn = document.getElementById('check');
const box = document.getElementById('status');

function distanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;
  const p1 = toRad(lat1), p2 = toRad(lat2);
  const dp = toRad(lat2 - lat1), dl = toRad(lon2 - lon1);
  const x = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

function showStatus(html, cls = '') {
  box.className = 'status show ' + cls;
  box.innerHTML = html;
}

function retry() {
  btn.disabled = false;
  btn.textContent = 'Tentar novamente';
}

btn.onclick = () => {
  if (!navigator.geolocation) {
    showStatus(
      '<div class="title">Seu navegador não oferece geolocalização.</div>' +
      '<p>Abra este link em um navegador atualizado do celular.</p>', 'bad');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Obtendo localização…';

  navigator.geolocation.getCurrentPosition(
    position => {
      const distance = distanceMeters(
        position.coords.latitude, position.coords.longitude, TARGET.lat, TARGET.lon);

      if (distance <= RADIUS) {
        showStatus(
          '<div class="title">✓ Localização confirmada</div>' +
          '<div class="distance">' + Math.round(distance) + ' m</div>' +
          '<p>Você está dentro da área permitida.</p>' +
          '<a class="btn" href="' + FORM_URL + '">Acessar formulário</a>', 'ok');
        btn.style.display = 'none';
      } else {
        showStatus(
          '<div class="title">✕ Fora da área permitida</div>' +
          '<div class="distance">' + Math.round(distance) + ' m</div>' +
          '<p>É necessário estar a até 1.000 metros do local autorizado para acessar o formulário.</p>',
          'bad');
        retry();
      }
    },
    error => {
      let message = 'Não foi possível obter sua localização.';
      if (error.code === 1) message = 'Você negou a permissão de localização. Ative a localização para continuar.';
      if (error.code === 2) message = 'O aparelho não conseguiu determinar sua localização. Tente novamente em um local com melhor sinal.';
      showStatus('<div class="title">' + message + '</div>', 'bad');
      retry();
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
};
</script>
</body>
</html>
